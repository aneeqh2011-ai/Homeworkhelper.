<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeworkTrack Pro v4</title><style>body{margin:0;font-family:system-ui;background:#f5f7fb;color:#172033}.top{background:#101827;color:white;padding:18px 24px;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:20px}main{max-width:1100px;margin:25px auto;padding:0 18px}.hero,.card,.panel{background:white;border:1px solid #e5e9f2;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.num{font-size:30px;font-weight:800}.muted{color:#667085}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}button{padding:8px 12px;border:1px solid #ccd3df;border-radius:8px;background:white;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="brand">HomeworkTrack PRO v4</div><div id="who">Checking staff access…</div></header><main><section id="login" class="hero"><h1>Teacher workspace</h1><p class="muted">Sign in through your school's Cloudflare Access policy.</p></section><section id="app" class="hidden"><div class="hero"><h1>Homework dashboard 👋</h1><p class="muted">Homework, completion and detention review.</p></div><div class="grid" id="stats"></div><div class="panel"><h2>Detention review</h2><div id="detentions">Loading…</div></div></section></main><script>
async function api(p,o){let r=await fetch(p,o);if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||r.status);return r.json()}
async function load(){try{let m=await api("/api/me");who.textContent=m.teacher.display_name+" · "+m.teacher.role;login.classList.add("hidden");app.classList.remove("hidden");let s=await api("/api/dashboard");stats.innerHTML=[["Classes",s.classes],["Students",s.students],["Homework",s.homework],["Incomplete",s.incomplete],["Detentions",s.detentions]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join("");let d=await api("/api/detentions");detentions.innerHTML=d.length?'<table><tr><th>Student</th><th>Reason</th><th>Status</th><th>Action</th></tr>'+d.map(x=>'<tr><td>'+x.first_name+" "+x.last_name+'</td><td>'+x.reason+'</td><td>'+x.status+'</td><td>'+ (x.status==="pending_review"?'<button onclick="review('+x.id+',\'approved\')">Approve</button> <button onclick="review('+x.id+',\'cancelled\')">Cancel</button>':"—")+'</td></tr>').join("")+'</table>':"No detention records yet."}catch(e){who.textContent="Staff access required"}}
async function review(id,status){await api("/api/detentions/review",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,status})});load()}load();
</script></body></html>
