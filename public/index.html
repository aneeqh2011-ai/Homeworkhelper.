```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeworkTrack PRO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: #151b2f;
      border: 1px solid #293250;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aab3cc;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .primary {
      background: #6366f1;
      color: white;
    }

    .primary:hover {
      background: #5558e8;
      transform: translateY(-1px);
    }

    .secondary {
      background: #222a43;
      color: white;
      border: 1px solid #343e5d;
    }

    .secondary:hover {
      background: #2b3552;
    }

    .hidden {
      display: none;
    }

    .login-box {
      text-align: left;
      margin-top: 10px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce2f5;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #343e5d;
      background: #0e1426;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: #6366f1;
    }

    .back {
      background: transparent;
      color: #9da8c5;
      margin-top: 10px;
    }

    .back:hover {
      color: white;
    }

    .footer {
      margin-top: 25px;
      color: #707b99;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- MAIN SCREEN -->
    <div class="card" id="mainScreen">

      <div class="logo">H</div>

      <h1>HomeworkTrack PRO</h1>

      <p class="subtitle">
        Organise homework, track assignments and stay on top of your school work.
      </p>

      <div class="buttons">
        <button class="primary" onclick="showLogin()">
          Sign In
        </button>

        <button class="secondary" onclick="showTeacher()">
          Teacher Workspace
        </button>
      </div>

      <div class="footer">
        HomeworkTrack PRO
      </div>

    </div>


    <!-- LOGIN SCREEN -->
    <div class="card hidden" id="loginScreen">

      <div class="logo">H</div>

      <h1>Welcome back</h1>

      <p class="subtitle">
        Sign in to HomeworkTrack PRO.
      </p>

      <div class="login-box">

        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

        <button class="primary" onclick="login()">
          Sign In
        </button>

        <button class="back" onclick="showMain()">
          ← Back
        </button>

      </div>

    </div>


    <!-- TEACHER SCREEN -->
    <div class="card hidden" id="teacherScreen">

      <div class="logo">T</div>

      <h1>Teacher Workspace</h1>

      <p class="subtitle">
        Teacher tools and classroom management.
      </p>

      <div class="buttons">

        <button class="primary" onclick="teacherLogin()">
          Teacher Sign In
        </button>

        <button class="back" onclick="showMain()">
          ← Back
        </button>

      </div>

    </div>

  </div>


  <script>

    function hideAll() {
      document.getElementById("mainScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("teacherScreen").classList.add("hidden");
    }

    function showMain() {
      hideAll();
      document.getElementById("mainScreen").classList.remove("hidden");
    }

    function showLogin() {
      hideAll();
      document.getElementById("loginScreen").classList.remove("hidden");
    }

    function showTeacher() {
      hideAll();
      document.getElementById("teacherScreen").classList.remove("hidden");
    }

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter your email and password.");
        return;
      }

      alert("Login system is not connected yet.");
    }

    function teacherLogin() {
      alert("Teacher login system is not connected yet.");
    }

  </script>

</body>
</html>
```
