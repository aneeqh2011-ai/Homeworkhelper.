<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HomeworkTrack PRO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: #151b2f;

      border: 1px solid #293250;
      border-radius: 22px;

      padding: 35px;

      box-shadow:
        0 20px 70px rgba(0,0,0,.35);
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 20px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #8b5cf6
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      text-align: center;

      margin:
        0 0 10px;

      font-size: 29px;
    }

    .subtitle {
      text-align: center;

      color: #aab3cc;

      line-height: 1.5;

      margin-bottom: 28px;
    }

    input {
      width: 100%;

      padding: 14px;

      margin-bottom: 14px;

      background: #0e1426;

      border: 1px solid #343e5d;

      border-radius: 10px;

      color: white;

      font-size: 16px;
    }

    input:focus {
      outline: none;

      border-color: #6366f1;
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 8px;
    }

    .primary {
      background: #6366f1;
      color: white;
    }

    .primary:hover {
      background: #5558e8;
    }

    .secondary {
      background: #222a43;
      color: white;

      border: 1px solid #343e5d;
    }

    .secondary:hover {
      background: #2d3755;
    }

    .link {
      background: transparent;

      color: #9da8c5;

      font-size: 14px;
    }

    .link:hover {
      color: white;
    }

    .hidden {
      display: none;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #222a43;

      color: #dce2f5;

      line-height: 1.4;
    }

    .dashboard {
      text-align: center;
    }

    .dashboard h2 {
      margin-bottom: 8px;
    }

    .account-info {
      background: #0e1426;

      border: 1px solid #293250;

      border-radius: 12px;

      padding: 15px;

      margin: 20px 0;

      text-align: left;

      line-height: 1.7;
    }

    .admin-badge {
      display: inline-block;

      background: #6366f1;

      padding: 5px 10px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }

    .student-badge {
      display: inline-block;

      background: #222a43;

      padding: 5px 10px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div
    class="card"
    id="loginScreen"
  >

    <div class="logo">H</div>

    <h1>
      HomeworkTrack PRO
    </h1>

    <p class="subtitle">
      Sign in using your username or email.
    </p>

    <input
      id="loginIdentifier"
      type="text"
      placeholder="Username or email"
      autocomplete="username"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Sign In
    </button>

    <button
      class="secondary"
      onclick="showRegister()"
    >
      Create Student Account
    </button>

    <div
      class="message"
      id="loginMessage"
    ></div>

  </div>


  <!-- REGISTER -->

  <div
    class="card hidden"
    id="registerScreen"
  >

    <div class="logo">H</div>

    <h1>
      Create Account
    </h1>

    <p class="subtitle">
      Create your HomeworkTrack PRO student account.
    </p>

    <input
      id="registerName"
      type="text"
      placeholder="Full name"
      autocomplete="name"
    >

    <input
      id="registerUsername"
      type="text"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="registerEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >

    <button
      class="primary"
      onclick="register()"
    >
      Create Account
    </button>

    <button
      class="link"
      onclick="showLogin()"
    >
      ← Back to login
    </button>

    <div
      class="message"
      id="registerMessage"
    ></div>

  </div>


  <!-- DASHBOARD -->

  <div
    class="card hidden"
    id="dashboard"
  >

    <div class="dashboard">

      <div class="logo">H</div>

      <h2 id="welcome">
        Welcome
      </h2>

      <div
        class="account-info"
        id="accountInfo"
      ></div>

      <button
        class="primary"
        id="adminButton"
        onclick="openAdmin()"
      >
        Admin Dashboard
      </button>

      <button
        class="secondary"
        onclick="logout()"
      >
        Log Out
      </button>

      <div
        class="message"
        id="dashboardMessage"
      ></div>

    </div>

  </div>

</div>


<script>

async function api(
  url,
  options = {}
) {

  const response =
    await fetch(
      url,
      {
        ...options,

        headers: {
          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );

  return response.json();
}


function showLogin() {

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("registerScreen")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.add("hidden");
}


function showRegister() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("registerScreen")
    .classList.remove("hidden");

  document
    .getElementById("dashboard")
    .classList.add("hidden");
}


function showDashboard(user) {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("registerScreen")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document
    .getElementById("welcome")
    .textContent =
      `Welcome, ${user.name}`;

  const accountInfo =
    document.getElementById(
      "accountInfo"
    );

  const badge =
    user.role === "admin"
      ? `<span class="admin-badge">ADMIN</span>`
      : `<span class="student-badge">STUDENT</span>`;

  accountInfo.innerHTML = `
    <strong>Username:</strong>
    ${escapeHtml(user.username)}
    <br>

    <strong>Email:</strong>
    ${escapeHtml(user.email)}
    <br>

    <strong>Account:</strong>
    ${badge}
  `;

  const adminButton =
    document.getElementById(
      "adminButton"
    );

  if (user.role === "admin") {
    adminButton.style.display =
      "block";
  } else {
    adminButton.style.display =
      "none";
  }
}


function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent = value;

  return div.innerHTML;
}


async function login() {

  const identifier =
    document
      .getElementById(
        "loginIdentifier"
      )
      .value
      .trim();

  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;

  const message =
    document.getElementById(
      "loginMessage"
    );

  message.style.display =
    "block";

  message.textContent =
    "Signing in...";

  try {

    const result =
      await api(
        "/api/login",
        {
          method: "POST",

          body: JSON.stringify({
            identifier,
            password
          })
        }
      );

    if (!result.success) {

      message.textContent =
        result.error;

      return;
    }

    showDashboard(
      result.user
    );

  } catch {

    message.textContent =
      "Something went wrong. Please try again.";
  }
}


async function register() {

  const name =
    document
      .getElementById(
        "registerName"
      )
      .value
      .trim();

  const username =
    document
      .getElementById(
        "registerUsername"
      )
      .value
      .trim();

  const email =
    document
      .getElementById(
        "registerEmail"
      )
      .value
      .trim();

  const password =
    document
      .getElementById(
        "registerPassword"
      )
      .value;

  const message =
    document.getElementById(
      "registerMessage"
    );

  message.style.display =
    "block";

  message.textContent =
    "Creating account...";

  try {

    const result =
      await api(
        "/api/register",
        {
          method: "POST",

          body: JSON.stringify({
            name,
            username,
            email,
            password
          })
        }
      );

    if (!result.success) {

      message.textContent =
        result.error;

      return;
    }

    message.textContent =
      "Account created! You can now sign in.";

    setTimeout(
      showLogin,
      1000
    );

  } catch {

    message.textContent =
      "Something went wrong. Please try again.";
  }
}


async function logout() {

  await api(
    "/api/logout",
    {
      method: "POST"
    }
  );

  showLogin();
}


async function openAdmin() {

  const result =
    await api(
      "/api/admin"
    );

  const message =
    document.getElementById(
      "dashboardMessage"
    );

  message.style.display =
    "block";

  if (!result.success) {

    message.textContent =
      result.error;

    return;
  }

  message.textContent =
    result.message;
}


async function checkLogin() {

  try {

    const result =
      await api(
        "/api/me"
      );

    if (result.loggedIn) {

      showDashboard(
        result.user
      );
    }

  } catch {

    console.log(
      "Not logged in."
    );
  }
}


checkLogin();

</script>

</body>
</html>
